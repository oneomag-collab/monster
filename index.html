<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монстр-404</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Orbitron:wght@400;700;900&family=Special+Elite&display=swap">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>
<body>
    <!-- Начальный экран: Ошибка 404 -->
    <div id="screen-404" class="screen active">
        <div class="error-container">
            <div class="error-number">
                <span class="digit">4</span>
                <span class="digit">0</span>
                <span class="digit">4</span>
            </div>
            <div class="error-text">МОНСТР НЕ НАЙДЕН</div>
            <div class="error-subtext">но он найдет тебя...</div>
        </div>
    </div>

    <!-- Экран монстра -->
    <div id="screen-monster" class="screen">
        <video id="monster-video" class="monster-video" muted playsinline>
            <!-- Замените на ваше видео монстра -->
            <source src="assets/monster-run.mp4" type="video/mp4">
            <source src="assets/monster-run.webm" type="video/webm">
        </video>
    </div>

    <!-- Экран кровавой таблички -->
    <div id="screen-blood" class="screen">
        <div class="blood-drip" id="drip1"></div>
        <div class="blood-drip" id="drip2"></div>
        <div class="blood-drip" id="drip3"></div>
        
        <div class="blood-plate">
            <div class="blood-stain"></div>
            <div class="plate-content">
                <h1 class="blood-title">ВВЕДИ СВОЁ ИМЯ</h1>
                <div class="input-container">
                    <input type="text" id="name-input" placeholder="ТВОЁ ИМЯ ЗДЕСЬ..." maxlength="20">
                    <button id="submit-btn">✓</button>
                </div>
                <div class="blood-warning">ОН ЖДЁТ...</div>
            </div>
        </div>
    </div>

    <!-- Экран приветствия -->
    <div id="screen-welcome" class="screen">
        <div class="welcome-container">
            <h2 id="welcome-text"></h2>
        </div>
    </div>

    <!-- Экран истории -->
    <div id="screen-story" class="screen">
        <div class="story-container">
            <div id="story-text" class="story-text"></div>
            <div id="choices" class="choices hidden"></div>
            <button id="continue-btn" class="continue-btn hidden">▶ ПРОДОЛЖИТЬ</button>
        </div>
        
        <!-- Добрый монстр -->
        <video id="friendly-monster" class="monster-video friendly" muted playsinline>
            <!-- Замените на ваше видео доброго монстра -->
            <source src="assets/friendly-monster.mp4" type="video/mp4">
            <source src="assets/friendly-monster.webm" type="video/webm">
        </video>
    </div>

    <!-- Экран концовки -->
    <div id="screen-ending" class="screen">
        <div class="ending-container">
            <div id="ending-text" class="ending-text"></div>
            <button id="restart-btn" class="restart-btn">НАЧАТЬ СНАЧАЛА</button>
        </div>
    </div>

    <!-- Аудио элементы -->
    <audio id="sound-drip" preload="auto">
        <source src="assets/sounds/drip.mp3" type="audio/mpeg">
    </audio>
    <audio id="sound-scary" preload="auto">
        <source src="assets/sounds/scary.mp3" type="audio/mpeg">
    </audio>
    <audio id="sound-magic" preload="auto">
        <source src="assets/sounds/magic.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
